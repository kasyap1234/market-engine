services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: market_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketdata
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U trader -d marketdata"]
      interval: 2s
      timeout: 5s
      retries: 15
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.enable_chunk_skipping=on"

volumes:
  tsdb_data:
